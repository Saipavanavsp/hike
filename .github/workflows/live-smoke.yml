name: Live site check

# Render deploys main automatically once this repository's checks pass
# (autoDeployTrigger: checksPass). This workflow smoke-tests the live site twice a day and on
# demand, so an outage or a broken deploy is noticed.
on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test the live site
    runs-on: ubuntu-latest
    env:
      SMOKE_URL: ${{ secrets.SMOKE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wake the free instance and wait for the API
        if: env.SMOKE_URL != ''
        run: |
          for i in $(seq 1 20); do
            curl -fsS -m 30 "$SMOKE_URL/api/health" && exit 0
            sleep 15
          done
          exit 1
      - name: Smoke test
        if: env.SMOKE_URL != ''
        run: node e2e/tools/smoke.cjs "$SMOKE_URL"

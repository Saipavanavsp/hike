name: E2E and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E against docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (migrate + seed + serve)
        run: docker compose up -d --build --wait --wait-timeout 600
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  deploy:
    name: Trigger Render deploy
    needs: e2e
    runs-on: ubuntu-latest
    env:
      API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
    steps:
      - name: Call deploy hooks
        run: |
          if [ -z "$API_HOOK" ] || [ -z "$WEB_HOOK" ]; then
            echo "Render deploy hook secrets are not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$API_HOOK"
          curl -fsS -X POST "$WEB_HOOK"
          echo "Deploys triggered."

[project]
name = "hike-backend"
version = "1.0.0"
description = "Hike - AI-powered job portal and recruitment platform (FastAPI backend)"
authors = [{ name = "Sai Pavan" }]
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
urls = { Repository = "https://github.com/Saipavanavsp/hike" }

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app", "seed"]
known-third-party = ["alembic"]  # the local alembic/ folder is migrations, not the package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/ml/eval.py"]

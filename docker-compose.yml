name: hike

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hike
      POSTGRES_PASSWORD: hike
      POSTGRES_DB: hike
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hike -d hike"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://hike:hike@postgres:5432/hike
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:

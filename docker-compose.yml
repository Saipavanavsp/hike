name: hike

# Default:     docker compose up --build              (app + worker)
# + ClamAV:    $env:MALWARE_SCAN="clamav"; docker compose --profile security up --build
# + Grafana:   docker compose --profile monitoring up --build
#              (Prometheus http://localhost:9090, Grafana http://localhost:3000, admin/admin)

x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgresql+psycopg://hike:hike@postgres:5432/hike
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
  FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:-dev-only-file-key}
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  TASKS_EAGER: "false"
  MALWARE_SCAN: ${MALWARE_SCAN:-heuristic}
  CLAMAV_HOST: clamav
  LOG_FORMAT: json

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hike
      POSTGRES_PASSWORD: hike
      POSTGRES_DB: hike
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hike -d hike"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    stop_grace_period: 30s
    environment:
      <<: *backend-env
      SEED_ON_START: ${SEED_ON_START:-true}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background jobs: resume parsing, embeddings, bulk scoring, email, retention (beat).
  worker:
    build: ./backend
    # SIGTERM = warm shutdown: finish running tasks, then exit. Unfinished ones are redelivered.
    stop_grace_period: 60s
    command: ["celery", "-A", "app.worker", "worker", "--beat", "--loglevel=INFO",
              "--concurrency=2", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
    volumes:
      - uploads:/data/storage
    healthcheck:
      # Healthy once the beat-scheduled heartbeat task has run (every 30s).
      test: ["CMD", "python", "-c", "import time,redis,sys; b=redis.Redis.from_url('redis://redis:6379/0').get('hike:worker:heartbeat'); sys.exit(0 if b and time.time()-int(b)<90 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      # Migrations run in the backend container; wait for them.
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  clamav:
    profiles: ["security"]
    image: clamav/clamav:stable
    # First start downloads the signature database (~1-3 minutes, ~1.2 GB RAM).
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Daily pg_dump of the database, verified after writing; 7 days kept (see docs/runbooks).
  backup:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGUSER: hike
      PGPASSWORD: hike
      PGDATABASE: hike
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ["sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./ops/backup:/scripts:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  backups:

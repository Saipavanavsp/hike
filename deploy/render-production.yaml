# Production Blueprint for Render (paid plans). The free blueprint is ../render.yaml.
#
# Differences from the free setup:
# - API and background worker run as separate services (TASKS_EAGER=false);
# - resumes live in an S3-compatible bucket (Cloudflare R2 recommended), encrypted by the app,
#   so they survive restarts and redeploys;
# - a paid PostgreSQL plan, which includes daily backups and point-in-time recovery;
# - JWT_SECRET and FILE_ENCRYPTION_KEY are generated once in an environment group and shared
#   by the API and the worker (the worker must decrypt the files the API stored).
#
# Use: in Render, New > Blueprint, choose the repo, and set the Blueprint path to
# deploy/render-production.yaml. Render asks for the S3_* values (marked sync: false).
# Plan names: https://render.com/docs/blueprint-spec

envVarGroups:
  - name: hike-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Keep this value: without it, stored resumes cannot be decrypted.
      - key: FILE_ENCRYPTION_KEY
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TASKS_EAGER
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_REGION
        value: auto
      - key: LOG_FORMAT
        value: json
      - key: PARSER_MEMORY_MB
        value: "384"
      - key: PUBLIC_APP_URL
        value: https://hike-web.onrender.com
      - key: EMAIL_BACKEND
        value: log

services:
  - type: web
    name: hike-api
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: hike-shared
      - key: DATABASE_URL
        fromDatabase:
          name: hike-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hike-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://hike-web.onrender.com
      - key: SEED_ON_START
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: hike-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.worker worker --beat --loglevel=INFO --concurrency=2 --schedule=/tmp/celerybeat-schedule
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: hike-shared
      - key: DATABASE_URL
        fromDatabase:
          name: hike-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hike-redis
          property: connectionString
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: hike-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: "off"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hike-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

  - type: keyvalue
    name: hike-redis
    plan: 256mb
    region: singapore
    # Celery's queue lives here: evicting keys would drop tasks.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: hike-db
    plan: 0.5c-1g
    region: singapore
    postgresMajorVersion: "16"
    databaseName: hike
    user: hike

# Render Blueprint: API (Docker web service), frontend (static site), Postgres, Key Value (Redis).
# Deploys are triggered by GitHub Actions (deploy.yml) after the E2E suite passes,
# so auto-deploy on push is turned off here.
#
# If Render gives your services different hostnames (the names below are taken), update
# CORS_ORIGINS and the /api/* rewrite destination to the URLs Render shows you.

services:
  - type: web
    name: hike-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hike-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hike-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Resume files are encrypted with this key. Keep it: changing it makes old files unreadable.
      - key: FILE_ENCRYPTION_KEY
        generateValue: true
      # /metrics requires "Authorization: Bearer <METRICS_TOKEN>" (copy it from the dashboard).
      - key: METRICS_TOKEN
        generateValue: true
      # The free plan has no background workers: tasks run inline in the API process.
      # On a paid plan, add a "worker" service running
      #   celery -A app.worker worker --beat --concurrency=2
      # with the same environment, and set TASKS_EAGER to "false".
      - key: TASKS_EAGER
        value: "true"
      - key: PARSER_MEMORY_MB
        value: "256"
      - key: LOG_FORMAT
        value: json
      # Links in emails and calendar invites. Update if Render gives hike-web another hostname.
      - key: PUBLIC_APP_URL
        value: https://hike-web.onrender.com
      # Emails are logged until you add an SMTP provider: set EMAIL_BACKEND=smtp and the
      # SMTP_HOST / SMTP_USERNAME / SMTP_PASSWORD / EMAIL_FROM variables in the dashboard.
      - key: EMAIL_BACKEND
        value: log
      # Optional error tracking: add SENTRY_DSN in the dashboard (needs a Sentry account).
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://hike-web.onrender.com
      - key: SEED_ON_START
        value: "true"
      # 512 MB: store the committed evaluation results instead of recomputing at start-up.
      - key: SEED_ARGS
        value: --no-eval --committed-eval
      # Free web services have no persistent disk: uploaded resumes are lost on restart.
      # For persistence set STORAGE_BACKEND=s3 and the S3_* variables (e.g. Cloudflare R2).
      - key: STORAGE_BACKEND
        value: local

  - type: web
    name: hike-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: "off"
    envVars:
      - key: VITE_API_URL
        value: ""
    routes:
      # Proxy the API through the static site so the refresh cookie stays first-party.
      - type: rewrite
        source: /api/*
        destination: https://hike-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Same security headers as frontend/nginx.conf.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

  - type: keyvalue
    name: hike-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # only reachable from Render services in this account

databases:
  - name: hike-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: hike
    user: hike

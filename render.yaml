# Render Blueprint: API (Docker web service), frontend (static site), Postgres, Key Value (Redis).
# Deploys are triggered by GitHub Actions (deploy.yml) after the E2E suite passes,
# so auto-deploy on push is turned off here.
#
# If Render gives your services different hostnames (the names below are taken), update
# CORS_ORIGINS and the /api/* rewrite destination to the URLs Render shows you.

services:
  - type: web
    name: hike-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hike-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hike-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://hike-web.onrender.com
      - key: SEED_ON_START
        value: "true"
      # Free web services have no persistent disk: uploaded resumes are lost on restart.
      # For persistence set STORAGE_BACKEND=s3 and the S3_* variables (e.g. Cloudflare R2).
      - key: STORAGE_BACKEND
        value: local

  - type: web
    name: hike-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: "off"
    envVars:
      - key: VITE_API_URL
        value: ""
    routes:
      # Proxy the API through the static site so the refresh cookie stays first-party.
      - type: rewrite
        source: /api/*
        destination: https://hike-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: keyvalue
    name: hike-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # only reachable from Render services in this account

databases:
  - name: hike-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: hike
    user: hike

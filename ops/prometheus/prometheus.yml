global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hike-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    # If METRICS_TOKEN is set on the API, add:
    # authorization:
    #   credentials: <token>
